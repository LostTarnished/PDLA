name: Run Tests
on:
  push:
    branches: ["main", "dev/tests"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Installer Python 3.13
        run: uv python install 3.13
      - name: Installer les dépendances
        run: uv sync --locked
      - name: Lancer pytest
        run: uv run pytest
