[project]
name = "arithmp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Mikaël Capelle", email = "capelle.mikael@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "lark>=1.3.1",
]

[project.scripts]
arithmp = "arithmp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.poe.tasks]
format = "ruff format ."
lint = "ruff check ."
typecheck = "ty check ."  # Ajout de 'check .' au lieu de 'ty' seul
check = ["lint", "typecheck"]
